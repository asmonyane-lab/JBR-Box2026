<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتر التجارة</title>
<link id="manifestLink" rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F2436">
<link id="iconLink" rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link id="appleIconLink" rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر التجارة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#0F2436;
    --bg-soft:#132C41;
    --surface:#1B3A54;
    --surface-2:#20455F;
    --border:rgba(243,238,225,0.12);
    --gold:#C9A15C;
    --gold-soft:rgba(201,161,92,0.15);
    --green:#3E8E7E;
    --green-soft:rgba(62,142,126,0.16);
    --red:#C1583F;
    --red-soft:rgba(193,88,63,0.16);
    --text:#F3EEE1;
    --muted:#9FB2C2;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'El Messiri',serif;}

  .zellige-strip{
    height:8px;
    background:
      repeating-linear-gradient(135deg, var(--gold) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(45deg, var(--green) 0 6px, transparent 6px 12px);
    background-size:16px 16px,16px 16px;
    background-position:0 0, 8px 0;
    opacity:0.9;
  }

  header.top{
    padding:18px 16px 14px;
    padding-top:calc(18px + env(safe-area-inset-top));
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
    background:linear-gradient(180deg,var(--bg-soft),var(--bg));
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap;
  }
  .brand-info{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand-info > div{min-width:0;}
  .shop-logo{width:48px; height:48px; border-radius:12px; object-fit:cover; border:1px solid var(--border); background:var(--surface); flex-shrink:0;}
  .brand h1{
    margin:0; font-size:22px; color:var(--gold); font-weight:700; letter-spacing:.3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .brand p{margin:2px 0 0; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .star{color:var(--green); font-size:16px; margin-left:6px;}

  .actions-bar{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; padding:14px 16px; background:var(--bg-soft);
    border-bottom:1px solid var(--border);
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
  }
  .actions-bar .btn:first-child{ grid-column:1 / -1; }
  .btn{
    border:none; cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:700;
    padding:13px 16px; border-radius:10px; font-size:14.5px; transition:transform .12s, filter .12s;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:46px; touch-action:manipulation;
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:var(--gold); color:#1a1206;}
  .btn-green{background:var(--green); color:#082420;}
  .btn-outline{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:var(--red-soft); color:#ffd7cb;}
  .btn-sm{padding:9px 12px; font-size:13px; border-radius:8px; min-height:38px;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  nav.tabs{
    display:flex; gap:4px; padding:12px 16px 0; overflow-x:auto; background:var(--bg);
    scrollbar-width:none; -ms-overflow-style:none;
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab{
    padding:11px 16px; border-radius:10px 10px 0 0; cursor:pointer; color:var(--muted);
    font-weight:700; font-size:13.5px; white-space:nowrap; border:1px solid transparent;
    touch-action:manipulation; flex-shrink:0;
  }
  .tab.active{
    background:var(--surface); color:var(--gold); border:1px solid var(--border); border-bottom-color:var(--surface);
  }

  main{
    padding:16px; max-width:1100px; margin:0 auto;
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
  }
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .grid-stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px;
  }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:"✦"; position:absolute; top:8px; left:10px; color:var(--gold); opacity:.5; font-size:14px;
  }
  .stat-card .label{color:var(--muted); font-size:12px; margin-bottom:6px;}
  .stat-card .value{font-family:'El Messiri',serif; font-size:19px; font-weight:700; word-break:break-word;}
  .stat-card.green .value{color:var(--green);}
  .stat-card.gold .value{color:var(--gold);}
  .stat-card.red .value{color:var(--red);}

  .section-title{
    display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700; margin:0 0 12px;
  }
  .section-title::before{content:"◆"; color:var(--gold); font-size:11px;}

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px; }
  .table-scroll table{ min-width:520px; }
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:right; color:var(--muted); font-weight:700; font-size:12px; padding:8px 8px;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody td .btn-sm{margin:2px 2px 2px 0;}
  tbody tr:hover{background:var(--surface-2);}
  .empty-row{text-align:center; color:var(--muted); padding:26px !important;}
  .badge{padding:3px 9px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap;}
  .badge.low{background:var(--red-soft); color:#ffcbbd;}
  .badge.ok{background:var(--green-soft); color:#bfe9de;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(6,14,22,0.65); display:none;
    align-items:flex-start; justify-content:center; padding:20px 12px; overflow-y:auto; z-index:50;
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--bg-soft); border:1px solid var(--border); border-radius:16px;
    width:100%; max-width:560px; padding:18px; margin-top:10px;
  }
  .modal h2{margin:0 0 4px; color:var(--gold); font-size:19px;}
  .modal .sub{color:var(--muted); font-size:13px; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px; font-weight:700;}
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-family:'Tajawal',sans-serif; font-size:16px;
    min-height:44px;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .line-item{
    display:grid; grid-template-columns:2.2fr 0.8fr 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:8px;
  }
  .line-item .field{margin-bottom:0;}
  .remove-line{background:var(--red-soft); color:#ffcbbd; border:none; border-radius:8px; padding:9px 10px; cursor:pointer; min-height:44px; min-width:44px;}
  .total-box{
    display:flex; justify-content:space-between; align-items:center; background:var(--surface);
    padding:12px 14px; border-radius:10px; margin:14px 0; border:1px solid var(--border);
  }
  .total-box .amount{font-family:'El Messiri',serif; font-size:22px; color:var(--gold); font-weight:700;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:6px; flex-wrap:wrap;}
  .modal-actions .btn{flex:1 1 auto; min-width:120px;}
  .warn{color:#ffcbbd; font-size:12.5px; margin-top:4px;}

  .invoice-head{text-align:center; margin-bottom:14px; border-bottom:2px dashed var(--border); padding-bottom:14px;}
  .invoice-head h2{margin:0; color:var(--gold);}
  .invoice-head p{color:var(--muted); margin:4px 0 0; font-size:13px;}
  .invoice-table th, .invoice-table td{font-size:13.5px;}
  .invoice-total{text-align:left; font-size:19px; font-weight:700; color:var(--gold); margin-top:10px; font-family:'El Messiri',serif;}

  footer{
    text-align:center; color:var(--muted); font-size:12px; padding:20px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }

  #toastContainer{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:100;
    bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;
    max-width:92vw;
  }
  .toast{
    background:var(--surface); border:1px solid var(--border); padding:10px 18px; border-radius:10px;
    font-size:13.5px; font-weight:700; box-shadow:0 6px 18px rgba(0,0,0,0.35);
    opacity:0; transform:translateY(10px); transition:opacity .25s, transform .25s;
    white-space:normal; text-align:center;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.success{color:#bfe9de; border-color:var(--green);}
  .toast.error{color:#ffcbbd; border-color:var(--red);}

  #storageBanner{
    display:none; margin:12px 16px 0; padding:12px 14px; background:var(--red-soft);
    border:1px solid var(--red); border-radius:10px; font-size:13.5px; line-height:1.7;
  }
  #storageBanner.show{display:block;}
  #storageBanner .banner-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; top:0; right:0; left:0; background:#fff; color:#111; padding:24px;}
  }
  @media (max-width:640px){
    .line-item{
      grid-template-columns:1fr 1fr; row-gap:8px;
    }
    .line-item .field:nth-child(1){ grid-column:1 / -1; }
    .line-item .field:nth-child(4){ grid-column:1 / -1; }
    .line-item .remove-line{ grid-column:1 / -1; justify-self:end; width:auto; padding:9px 16px; }
    .row2{grid-template-columns:1fr;}
    .brand h1{ max-width:52vw; }
    .stat-card .value{ font-size:17px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="brand-info">
      <img id="shopLogo" class="shop-logo" style="display:none;">
      <div>
        <h1 id="shopTitle"><span class="star">✦</span>دفتر التجارة</h1>
        <p id="shopSub">تسيير البيع والشراء والفواتير، والزبناء والموردين — لتجارتك ديال كل يوم</p>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
      <button class="btn btn-outline btn-sm" onclick="openSettingsModal()">⚙️ إعدادات المحل</button>
      <span id="syncBadge" style="display:none; font-size:11px; font-weight:700;"></span>
    </div>
  </div>
</header>
<div class="zellige-strip"></div>

<div class="actions-bar">
  <button class="btn btn-gold" onclick="openSaleModal()">🧾 بيع جديد</button>
  <button class="btn btn-outline" onclick="openOrderModal()">📋 طلب جديد</button>
  <button class="btn btn-green" onclick="openPurchaseModal()">📦 شراء جديد</button>
  <button class="btn btn-outline" onclick="openClientModal()">👤 زبون جديد</button>
  <button class="btn btn-outline" onclick="openSupplierModal()">🚚 مورد جديد</button>
  <button class="btn btn-outline" onclick="openProductModal()">🛒 منتوج جديد</button>
</div>

<div id="storageBanner"></div>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<footer>دفتر التجارة — البيانات محفوظة عندك فقط</footer>

<!-- Overlay/Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div id="toastContainer"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="handleImportFile(this)">

<script>
const CURRENCY = 'DH';
let state = { products: [], clients: [], suppliers: [], sales: [], purchases: [], orders: [], openingBalances: [], settings: {shopName:'', phone:'', logo:''} };
let activeTab = 'overview';
let salePaidTouched = false;
let purchPaidTouched = false;
let saleTotalTouched = false;
let purchTotalTouched = false;
let orderTotalTouched = false;
let productSearch = '';
let clientSearch = '';
let supplierSearch = '';
let storageAvailable = true;
const STORAGE_PREFIX = 'daftar_tijara_';

const firebaseConfig = {
  apiKey: "AIzaSyBT-IGgYZvBgIJ_IfZYbt5ST5vlI_Y2CG4",
  authDomain: "jbrbox-14d1a.firebaseapp.com",
  databaseURL: "https://jbrbox-14d1a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jbrbox-14d1a",
  storageBucket: "jbrbox-14d1a.firebasestorage.app",
  messagingSenderId: "906166494108",
  appId: "1:906166494108:web:ecc1d09b2ae00ec1f19e59"
};
let fbApp = null, fbDb = null, fbAuth = null, fbRef = null, applyingRemoteData = false, cloudSyncEnabled = false;
let fbUser = null;

function ensureFirebaseApp(){
  if(typeof firebase==='undefined'){
    console.error('Firebase SDK ما تحملش (typeof firebase === undefined)');
    return false;
  }
  if(fbApp) return true;
  try{
    fbApp = firebase.initializeApp(firebaseConfig);
    fbDb = firebase.database();
    if(typeof firebase.auth !== 'function'){
      console.error('firebase.auth ماشي متوفرة - firebase-auth-compat.js ما تحملش');
      fbApp = null;
      return false;
    }
    fbAuth = firebase.auth();
    fbAuth.onAuthStateChanged((user)=>{
      fbUser = user;
      renderSyncBadge();
      initCloudSync();
    });
    return true;
  }catch(e){
    console.error('تعذرت تهيئة Firebase:', e);
    fbApp = null;
    return false;
  }
}
function currentSyncKey(){
  if(fbUser) return 'user_'+fbUser.uid;
  const storeId = (state.settings.storeId||'').trim();
  return storeId ? 'code_'+storeId : '';
}
async function signInWithGoogle(){
  if(!ensureFirebaseApp()){
    alert('تعذر تحميل خدمة تسجيل الدخول. تحقق من الاتصال بالانترنت وعاود جرب. إلا تكرر المشكل، يمكن يكون شي حاجب (ad-blocker/VPN) كيمنع تحميل مكتبة Google.');
    return;
  }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await fbAuth.signInWithPopup(provider);
    showToast('تم تسجيل الدخول ✓', 'success');
    closeModal();
    openSettingsModal();
  }catch(e){
    console.error('Google sign-in error:', e.code, e.message);
    let msg = 'تعذر تسجيل الدخول: ' + (e.code || e.message || 'خطأ غير معروف');
    if(e.code === 'auth/unauthorized-domain'){
      msg = 'هاد الموقع (' + location.hostname + ') ماشي مصرح ليه فFirebase. زيدو فـ Authentication > Settings > Authorized domains';
    } else if(e.code === 'auth/popup-blocked'){
      msg = 'المتصفح حجب النافذة المنبثقة. فعل النوافذ المنبثقة وعاود جرب';
    } else if(e.code === 'auth/operation-not-supported-in-this-environment'){
      msg = 'هاد المتصفح/البيئة ما كتدعمش تسجيل الدخول بهاد الطريقة. جرب من متصفح Chrome مباشرة';
    }
    alert(msg);
    showToast('تعذر تسجيل الدخول', 'error');
  }
}
async function signOutOfGoogle(){
  if(!fbAuth) return;
  try{
    await fbAuth.signOut();
    showToast('تم تسجيل الخروج', 'success');
    closeModal();
    openSettingsModal();
  }catch(e){ console.error(e); }
}
function initCloudSync(){
  const key = currentSyncKey();
  if(!key || !ensureFirebaseApp()){ cloudSyncEnabled = false; renderSyncBadge(); return; }
  try{
    if(fbRef) fbRef.off();
    fbRef = fbDb.ref('stores/'+key);
    cloudSyncEnabled = true;
    fbRef.on('value', (snapshot)=>{
      const data = snapshot.val();
      renderSyncBadge();
      if(!data){ pushToCloud(); return; } // ما كاين حتى بيانات فالسحاب بعد لهاد الحساب، نصيفطو الحالية
      applyingRemoteData = true;
      state.products = data.products || [];
      state.clients = data.clients || [];
      state.suppliers = data.suppliers || [];
      state.sales = data.sales || [];
      state.purchases = data.purchases || [];
      state.orders = data.orders || [];
      state.openingBalances = data.openingBalances || [];
      if(data.settings){
        const keepStoreId = state.settings.storeId;
        state.settings = {...state.settings, ...data.settings};
        if(fbUser) state.settings.storeId = keepStoreId; // ماشي مهم ملي كنخدمو بالحساب
      }
      storageSet('products', state.products);
      storageSet('clients', state.clients);
      storageSet('suppliers', state.suppliers);
      storageSet('sales', state.sales);
      storageSet('purchases', state.purchases);
      storageSet('orders', state.orders);
      storageSet('openingBalances', state.openingBalances);
      storageSet('settings', state.settings);
      renderHeader();
  updatePWAIdentity();
      render();
      applyingRemoteData = false;
    }, (err)=>{
      console.error('تعذر الاتصال بالمزامنة', err);
      cloudSyncEnabled = false;
      renderSyncBadge();
    });
  }catch(e){
    console.error('تعذر تفعيل المزامنة', e);
    cloudSyncEnabled = false;
    renderSyncBadge();
  }
}
function pushToCloud(){
  if(!cloudSyncEnabled || applyingRemoteData || !fbRef) return;
  fbRef.set({
    products: state.products,
    clients: state.clients,
    suppliers: state.suppliers,
    sales: state.sales,
    purchases: state.purchases,
    orders: state.orders,
    openingBalances: state.openingBalances,
    settings: state.settings,
    updatedAt: Date.now()
  }).catch(e=> console.error('تعذرت المزامنة السحابية', e));
}
function renderSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const key = currentSyncKey();
  if(!key){ el.style.display='none'; return; }
  el.style.display='inline-flex';
  if(fbUser){
    el.textContent = cloudSyncEnabled ? `🔗 متصل: ${fbUser.email}` : '⚠️ تعذرت المزامنة';
  } else {
    el.textContent = cloudSyncEnabled ? '🔗 مزامنة مفعّلة' : '⚠️ تعذرت المزامنة';
  }
  el.style.color = cloudSyncEnabled ? '#bfe9de' : '#ffcbbd';
}

function checkStorageAvailable(){
  try{
    localStorage.setItem(STORAGE_PREFIX+'__healthcheck__', '1');
    localStorage.removeItem(STORAGE_PREFIX+'__healthcheck__');
    return true;
  }catch(e){
    console.error('التخزين المحلي غير متوفر', e);
    return false;
  }
}
function storageGet(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw!==null ? JSON.parse(raw) : null;
  }catch(e){
    console.error('تعذرت قراءة', key, e);
    return null;
  }
}
function storageSet(key, value){
  try{
    localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('تعذر الحفظ', key, e);
    return false;
  }
}
function renderStorageBanner(){
  const el = document.getElementById('storageBanner');
  if(!el) return;
  if(storageAvailable){ el.className=''; el.innerHTML=''; return; }
  el.className = 'show';
  el.innerHTML = `
    <strong>⚠️ التخزين غير متوفر فهاد المتصفح.</strong><br>

  };

  a.href = url; a.download = `نسخة_احتياطية_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

function triggerImport(){

}
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{
      data = JSON.parse(reader.result);
    }catch(e){
      alert('الملف غير صالح، تأكد أنه نسخة احتياطية صحيحة');
      input.value='';
      return;
    }
    showConfirmModal('غادي تعوض جميع البيانات الحالية بهاد النسخة الاحتياطية. متأكد؟', ()=>{
      state.products = data.products || [];
      state.clients = data.clients || [];
      state.suppliers = data.suppliers || [];
      state.sales = data.sales || [];
      state.purchases = data.purchases || [];
      state.orders = data.orders || [];
      state.settings = data.settings || {shopName:'', phone:'', logo:''};
      renderHeader();
  updatePWAIdentity();
      saveAll(['products','clients','suppliers','sales','purchases','orders'], 'تم استرجاع النسخة الاحتياطية ✓');
      saveSettingsStorage();
      closeModal();
      render();
    }, '✅ نعم، استرجاع');
    input.value='';
  };
  reader.readAsText(file);
}

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function money(n){ return '\u202A' + (Number(n)||0).toFixed(2) + ' ' + CURRENCY + '\u202C'; }
function fmtPhone(phone){ return phone ? `<bdi>${phone}</bdi>` : ''; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  try{
    const dt = new Date(d);
    if(isNaN(dt.getTime())) return d;
    const day = String(dt.getDate()).padStart(2,'0');
    const month = String(dt.getMonth()+1).padStart(2,'0');
    const year = dt.getFullYear();
    return `${day}/${month}/${year}`;
  }catch(e){ return d; }
}

function showToast(message, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'success');
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');

  }, 2200);

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 240; quality = quality || 0.82;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let width = img.width, height = img.height;
        if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else{ if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('صورة غير صالحة'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('تعذرت قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

function saleRemaining(s){ return s.total - (s.paid!=null ? s.paid : s.total); }
function purchRemaining(p){ return p.total - (p.paid!=null ? p.paid : p.total); }
function obRemaining(o){ return o.total - (o.paid!=null ? o.paid : 0); }
function clientDebtTotal(clientId){
  const salesDebt = state.sales.filter(s=>s.partyId===clientId).reduce((sum,s)=>sum+Math.max(0,saleRemaining(s)),0);
  const obDebt = state.openingBalances.filter(o=>o.kind==='client' && o.partyId===clientId).reduce((sum,o)=>sum+Math.max(0,obRemaining(o)),0);
  return salesDebt + obDebt;
}
function supplierDebtTotal(supplierId){
  const purchDebt = state.purchases.filter(p=>p.partyId===supplierId).reduce((sum,p)=>sum+Math.max(0,purchRemaining(p)),0);
  const obDebt = state.openingBalances.filter(o=>o.kind==='supplier' && o.partyId===supplierId).reduce((sum,o)=>sum+Math.max(0,obRemaining(o)),0);
  return purchDebt + obDebt;
}

function renderOverview(){
  const totalSales = state.sales.reduce((s,x)=>s+x.total,0);
  const totalPurchases = state.purchases.reduce((s,x)=>s+x.total,0);
  const stockValue = state.products.reduce((s,p)=>s+(p.qty*p.buyPrice),0);
  const lowStock = state.products.filter(p=>p.qty<=5);
  const today = todayStr();
  const todayProfit = state.sales.filter(s=>s.date===today).reduce((sum,s)=>{
    return sum + s.items.reduce((isum,it)=>{
      const prod = state.products.find(p=>p.id===it.productId);
      const buy = prod ? prod.buyPrice : 0;
      return isum + it.qty*(it.price - buy);
    }, 0);
  }, 0);
  const clientDebt = state.sales.reduce((s,x)=>s+Math.max(0,saleRemaining(x)),0)
    + state.openingBalances.filter(o=>o.kind==='client').reduce((s,o)=>s+Math.max(0,obRemaining(o)),0);
  const supplierDebt = state.purchases.reduce((s,x)=>s+Math.max(0,purchRemaining(x)),0)
    + state.openingBalances.filter(o=>o.kind==='supplier').reduce((s,o)=>s+Math.max(0,obRemaining(o)),0);
  const pendingOrders = state.orders.filter(o=>o.deliveryStatus!=='تم التسليم').length;
  return `
    <div class="grid-stats">
      <div class="stat-card gold"><div class="label">مجموع المبيعات</div><div class="value">${money(totalSales)}</div></div>
      <div class="stat-card"><div class="label">مجموع المشتريات</div><div class="value">${money(totalPurchases)}</div></div>
      <div class="stat-card ${todayProfit<0?'red':'green'}"><div class="label">الربح الصافي اليوم</div><div class="value">${money(todayProfit)}</div></div>
      <div class="stat-card"><div class="label">قيمة المخزون</div><div class="value">${money(stockValue)}</div></div>
      <div class="stat-card ${lowStock.length?'red':''}"><div class="label">منتوجات ناقصة</div><div class="value">${lowStock.length}</div></div>
      <div class="stat-card ${pendingOrders?'gold':''}"><div class="label">طلبات فالانتظار</div><div class="value">${pendingOrders}</div></div>
      <div class="stat-card ${clientDebt>0?'red':''}"><div class="label">ديون الزبناء عندنا</div><div class="value">${money(clientDebt)}</div></div>
      <div class="stat-card ${supplierDebt>0?'red':''}"><div class="label">ديون عند الموردين</div><div class="value">${money(supplierDebt)}</div></div>
    </div>
    <div class="panel">
      <div class="section-title">الربح الصافي لكل يوم</div>
      ${renderDailyProfit()}
    </div>
    <div class="panel">
      <div class="section-title">آخر العمليات</div>
      ${renderRecentOps()}
    </div>
  `;
}
function renderDailyProfit(){
  const map = {};
  state.sales.forEach(s=>{
    if(!map[s.date]) map[s.date] = 0;
    s.items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      const buy = prod ? prod.buyPrice : 0;
      map[s.date] += it.qty * (it.price - buy);
    });
  });
  const days = Object.keys(map).sort((a,b)=> new Date(b)-new Date(a));
  if(!days.length) return `<div class="empty-row">مازال ما كاين حتى بيع باش نحسبو الربح</div>`;
  const rows = days.map(d=>{
    const p = map[d];
    return `<tr>
      <td>${fmtDate(d)}</td>
      <td style="color:${p>=0?'var(--green)':'var(--red)'}; font-weight:700;">${money(p)}</td>
    </tr>`;
  }).join('');
  return `<div class="table-scroll"><table><thead><tr><th>التاريخ</th><th>الربح الصافي</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function confirmPartyPay(kind, partyId){
  const isClient = kind==='client';
  let amt = parseFloat(document.getElementById('partyPayAmount').value)||0;
  const date = document.getElementById('partyPayDate').value || todayStr();
  if(amt<=0){ alert('دخل مبلغ صحيح'); return; }
  const records = isClient ? state.sales : state.purchases;
  const unpaidRecords = records.filter(r=>r.partyId===partyId && (isClient?saleRemaining(r):purchRemaining(r))>0.001)
                                .map(r=>({rec:r, date:r.date, remaining: isClient?saleRemaining(r):purchRemaining(r)}));
  const unpaidOpening = state.openingBalances.filter(o=>o.kind===kind && o.partyId===partyId && obRemaining(o)>0.001)
                                .map(o=>({rec:o, date:o.date, remaining: obRemaining(o)}));
  const queue = unpaidRecords.concat(unpaidOpening).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const touchedRecordKeys = new Set();
  for(const item of queue){
    if(amt<=0) break;
    const pay = Math.min(amt, item.remaining);
    item.rec.paid = (item.rec.paid!=null ? item.rec.paid : 0) + pay;
    if(!item.rec.payments) item.rec.payments = [];
    item.rec.payments.push({date, amount:pay});
    amt -= pay;
    touchedRecordKeys.add(unpaidRecords.includes(item) ? (isClient?'sales':'purchases') : 'openingBalances');
  }
  saveAll(Array.from(touchedRecordKeys.size ? touchedRecordKeys : [isClient?'sales':'purchases']), 'تم تسجيل الدفعة ✓');
  closeModal(); activeTab='debts'; render();
}

let pendingConfirmAction = null;

function runConfirmedAction(){
  const action = pendingConfirmAction;
  pendingConfirmAction = null;

}

  let total = 0;
  document.querySelectorAll('#saleLines .line-item').forEach(div=>{
    const qty = parseFloat(div.querySelector('.qty-input').value)||0;
    const price = parseFloat(div.querySelector('.price-input').value)||0;

    div.querySelector('.total-input').value = sub.toFixed(2);
    total += sub;
  });
  const el = document.getElementById('saleTotal');
  if(el && !saleTotalTouched) el.value = total.toFixed(2);
  updateSalePreview();
}
function updateSalePreview(){
  const paidEl = document.getElementById('salePaid');
  if(!paidEl) return;
  const total = parseFloat(document.getElementById('saleTotal')?.value)||0;
  const paid = parseFloat(paidEl.value)||0;
  const remaining = total - paid;
  const el = document.getElementById('saleRemainingPreview');
  if(el) el.textContent = remaining>0 ? `دين باقي على الزبون: ${money(remaining)}` : 'المبلغ مخلص بالكامل';
}
function saveSale(){
  const editId = document.getElementById('saleEditId').value;
  const date = document.getElementById('saleDate').value || todayStr();
  const clientId = document.getElementById('saleClientId').value;
  const typedClientName = document.getElementById('saleClientName').value.trim();
  const clientName = clientId ? state.clients.find(c=>c.id===clientId)?.name : (typedClientName || 'زبون عابر');
  const items = [];
  let stockProblem = false;
  document.querySelectorAll('#saleLines .line-item').forEach(div=>{
    const productId = div.querySelector('.product-id-input').value;
    const qty = parseFloat(div.querySelector('.qty-input').value)||0;
    const price = parseFloat(div.querySelector('.price-input').value)||0;
    if(productId && qty>0){
      const prod = state.products.find(p=>p.id===productId);
      items.push({productId, name: prod?prod.name:'', qty, price, sub: qty*price});
    }
  });
  if(!items.length){ alert('زيد على الأقل منتوج واحد (تأكد أنك اخترتي اسم موجود من القائمة)'); return; }
  const total = parseFloat(document.getElementById('saleTotal').value)||0;

  if(editId){
    const sale = state.sales.find(s=>s.id===editId);
    if(!sale){ closeModal(); return; }
    // نرجعو المخزون للحالة الأصلية قبل التعديل
    sale.items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      if(prod) prod.qty += it.qty;
    });
    items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      if(prod && prod.qty < it.qty) stockProblem = true;
    });
    const finalizeEdit = ()=>{
      items.forEach(it=>{
        const prod = state.products.find(p=>p.id===it.productId);
        if(prod) prod.qty -= it.qty;
      });
      sale.date = date; sale.partyId = clientId||null; sale.partyName = clientName;
      sale.items = items; sale.total = total;
      saveAll(['products','sales'], 'تم تعديل البيع ✓');
      closeModal(); activeTab='sales'; render();
    };
    if(stockProblem){
      showConfirmModal('الكمية المطلوبة كبر من المخزون ديال شي منتوج. بغيتي تكمل؟', finalizeEdit, '✅ نعم، كمل');
    } else {
      finalizeEdit();
    }
    return;
  }

  document.querySelectorAll('#saleLines .line-item').forEach(div=>{
    const productId = div.querySelector('.product-id-input').value;
    const qty = parseFloat(div.querySelector('.qty-input').value)||0;
    if(productId && qty>0){
      const prod = state.products.find(p=>p.id===productId);
      if(prod && prod.qty < qty) stockProblem = true;
    }
  });
  const paid = parseFloat(document.getElementById('salePaid').value)||0;
  const finalizeSale = ()=>{
    items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      if(prod) prod.qty -= it.qty;
    });
    const payments = paid>0 ? [{date, amount: paid}] : [];
    state.sales.push({id:uid('sl'), date, partyId: clientId||null, partyName: clientName, items, total, paid, payments});
    saveAll(['products','sales'], 'تم حفظ البيع ✓');
    closeModal(); activeTab='sales'; render();
  };
  if(stockProblem){
    showConfirmModal('الكمية المطلوبة كبر من المخزون ديال شي منتوج. بغيتي تكمل؟', finalizeSale, '✅ نعم، كمل');
  } else {
    finalizeSale();
  }
}

function saveOrder(){
  const editId = document.getElementById('orderEditId').value;
  const date = document.getElementById('orderDate').value || todayStr();
  const deliveryDate = document.getElementById('orderDeliveryDate').value || '';
  const deliveryStatus = document.getElementById('orderDeliveryStatus').value || 'قيد التحضير';
  const note = document.getElementById('orderNote').value.trim();
  const clientId = document.getElementById('orderClientId').value;
  const typedClientName = document.getElementById('orderClientName').value.trim();
  const clientName = clientId ? state.clients.find(c=>c.id===clientId)?.name : (typedClientName || 'زبون عابر');
  const clientPhone = clientId ? (state.clients.find(c=>c.id===clientId)?.phone||'') : '';
  const items = [];
  document.querySelectorAll('#orderLines .line-item').forEach(div=>{
    const productId = div.querySelector('.product-id-input').value;
    const qty = parseFloat(div.querySelector('.qty-input').value)||0;
    const price = parseFloat(div.querySelector('.price-input').value)||0;
    if(productId && qty>0){
      const prod = state.products.find(p=>p.id===productId);
      items.push({productId, name: prod?prod.name:'', qty, price, sub: qty*price});
    }
  });
  if(!items.length){ alert('زيد على الأقل منتوج واحد (تأكد أنك اخترتي اسم موجود من القائمة)'); return; }
  const total = parseFloat(document.getElementById('orderTotal').value)||0;

  if(editId){
    const order = state.orders.find(o=>o.id===editId);
    if(!order){ closeModal(); return; }
    order.date = date; order.partyId = clientId||null; order.partyName = clientName; order.phone = clientPhone;
    order.items = items; order.total = total;
    order.deliveryDate = deliveryDate; order.deliveryStatus = deliveryStatus; order.note = note;
    saveAll(['orders'], 'تم تعديل الطلب ✓');
    closeModal(); activeTab='orders'; render();
    return;
  }
  const paid = parseFloat(document.getElementById('orderPaid').value)||0;
  const payments = paid>0 ? [{date, amount: paid}] : [];
  state.orders.push({
    id:uid('or'), date, partyId: clientId||null, partyName: clientName, phone: clientPhone,
    items, total, paid, payments, deliveryDate, deliveryStatus, note, convertedSaleId:null
  });
  saveAll(['orders'], 'تم تسجيل الطلب ✓');
  closeModal(); activeTab='orders'; render();
}

function savePurchase(){
  const editId = document.getElementById('purchEditId').value;
  const date = document.getElementById('purchDate').value || todayStr();
  const supplierId = document.getElementById('purchSupplierId').value;
  const typedSupplierName = document.getElementById('purchSupplierName').value.trim();
  const supplierName = supplierId ? state.suppliers.find(s=>s.id===supplierId)?.name : (typedSupplierName || 'بلا مورد محدد');
  const items = [];
  document.querySelectorAll('#purchLines .line-item').forEach(div=>{
    const productId = div.querySelector('.product-id-input').value;
    const qty = parseFloat(div.querySelector('.qty-input').value)||0;
    const price = parseFloat(div.querySelector('.price-input').value)||0;
    if(productId && qty>0){
      const prod = state.products.find(p=>p.id===productId);
      items.push({productId, name: prod?prod.name:'', qty, price, sub: qty*price});
    }
  });
  if(!items.length){ alert('زيد على الأقل منتوج واحد (تأكد أنك اخترتي اسم موجود من القائمة)'); return; }
  const total = parseFloat(document.getElementById('purchTotal').value)||0;

  if(editId){
    const purch = state.purchases.find(p=>p.id===editId);
    if(!purch){ closeModal(); return; }
    // نرجعو المخزون للحالة الأصلية قبل التعديل (كنحيدو الكمية اللي كانت زادت)
    purch.items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      if(prod) prod.qty -= it.qty;
    });
    items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      if(prod) prod.qty += it.qty;
    });
    purch.date = date; purch.partyId = supplierId||null; purch.partyName = supplierName;
    purch.items = items; purch.total = total;
    saveAll(['products','purchases'], 'تم تعديل الشراء ✓');
    closeModal(); activeTab='purchases'; render();
    return;
  }

  const paid = parseFloat(document.getElementById('purchPaid').value)||0;
  items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.productId);
    if(prod) prod.qty += it.qty;
  });
  const payments = paid>0 ? [{date, amount: paid}] : [];
  state.purchases.push({id:uid('pu'), date, partyId: supplierId||null, partyName: supplierName, items, total, paid, payments});
  saveAll(['products','purchases'], 'تم حفظ الشراء ✓');
  closeModal(); activeTab='purchases'; render();
}

/* ---------- Pay debt ---------- */
function openPayModal(kind, id){
  const list = kind==='sale' ? state.sales : (kind==='order' ? state.orders : state.purchases);
  const rec = list.find(x=>x.id===id);
  if(!rec) return;
  const remaining = kind==='sale' ? saleRemaining(rec) : (kind==='order' ? orderRemaining(rec) : purchRemaining(rec));
  const who = kind==='purchase' ? 'المورد' : 'الزبون';
  showModal(`
    <h2>تسجيل الدفع</h2>
    <div class="sub">${who}: ${rec.partyName||'—'} • الباقي الحالي: ${money(remaining)}</div>
    <div class="field"><label>المبلغ المدفوع الآن</label><input id="payAmount" type="number" min="0" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>تاريخ الدفعة</label><input id="payDate" type="date" value="${todayStr()}"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-gold" onclick="confirmPay('${kind}','${id}')">💵 تسجيل الدفع</button>
    </div>
  `);
}
function confirmPay(kind, id){
  const list = kind==='sale' ? state.sales : (kind==='order' ? state.orders : state.purchases);
  const rec = list.find(x=>x.id===id);
  if(!rec) return;
  const amt = parseFloat(document.getElementById('payAmount').value)||0;
  const date = document.getElementById('payDate').value || todayStr();
  if(amt<=0){ alert('دخل مبلغ صحيح'); return; }
  rec.paid = (rec.paid!=null ? rec.paid : 0) + amt;
  if(!rec.payments) rec.payments = [];
  rec.payments.push({date, amount: amt});
  const collectionKey = kind==='sale' ? 'sales' : (kind==='order' ? 'orders' : 'purchases');
  saveAll([collectionKey], 'تم حفظ الدفعة ✓');
  closeModal(); render();
}

/* ---------- Order delivery tracking ---------- */
function updateOrderStatus(id, newStatus){
  const order = state.orders.find(o=>o.id===id);
  if(!order || order.deliveryStatus==='تم التسليم'){ render(); return; }
  if(newStatus === 'تم التسليم'){
    showConfirmModal('تأكيد تسليم الطلب غادي يحوله لبيع جديد ويدخلو فالمبيعات تلقائيا. متأكد؟', ()=> completeOrder(id), '✅ نعم، تم التسليم');
    render();
  } else {
    order.deliveryStatus = newStatus;
    saveAll(['orders'], 'تم تحديث حالة الطلب ✓');
    render();
  }
}
function completeOrder(id){
  const order = state.orders.find(o=>o.id===id);
  if(!order || order.deliveryStatus==='تم التسليم'){ closeModal(); return; }
  let stockProblem = false;
  order.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.productId);
    if(prod && prod.qty < it.qty) stockProblem = true;
  });
  const finalize = ()=>{
    order.items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      if(prod) prod.qty -= it.qty;
    });
    const sale = {
      id: uid('sl'), date: todayStr(), partyId: order.partyId||null, partyName: order.partyName,
      items: order.items, total: order.total, paid: order.paid!=null?order.paid:0,
      payments: order.payments||[], fromOrderId: order.id
    };
    state.sales.push(sale);
    order.deliveryStatus = 'تم التسليم';
    order.convertedSaleId = sale.id;
    order.deliveredDate = todayStr();
    saveAll(['products','sales','orders'], 'تم تسليم الطلب وتحويله لبيع جديد فالمبيعات ✓');
    closeModal(); render();
  };
  if(stockProblem){
    showConfirmModal('الكمية المطلوبة كبر من المخزون ديال شي منتوج. بغيتي تكمل التسليم؟', finalize, '✅ نعم، كمل');
  } else {
    finalize();
  }
}
function shareOrderWhatsApp(id){
  const order = state.orders.find(o=>o.id===id);
  if(!order) return;
  const s = state.settings;
  const plainMoney = n => (Number(n)||0).toFixed(2) + ' ' + CURRENCY;
  const remaining = orderRemaining(order);
  let msg = `*${s.shopName||'دفتر التجارة'}*\n`;
  msg += `طلب بتاريخ ${fmtDate(order.date)}\n`;
  msg += `الزبون: ${order.partyName||'زبون عابر'}\n\n`;
  order.items.forEach(it=>{ msg += `- ${it.name} × ${it.qty} = ${plainMoney(it.sub)}\n`; });
  msg += `\nالمجموع: ${plainMoney(order.total)}\n`;
  if(order.paid>0) msg += `المؤدى: ${plainMoney(order.paid)}\n`;
  if(remaining>0) msg += `الباقي: ${plainMoney(remaining)}\n`;
  msg += `حالة التسليم: ${order.deliveryStatus||'قيد التحضير'}\n`;
  if(order.deliveryDate) msg += `تاريخ التسليم المتوقع: ${fmtDate(order.deliveryDate)}\n`;
  if(order.note) msg += `ملاحظات: ${order.note}\n`;
  const digitsOnly = (order.phone||'').replace(/[^0-9]/g,'');
  let waPhone = '';
  if(digitsOnly){
    waPhone = digitsOnly.startsWith('212') ? digitsOnly : ('212' + digitsOnly.replace(/^0+/,''));
  }
  const url = `https://wa.me/${waPhone}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}
